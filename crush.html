<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff0f3">
  <title>Gửi Linh, từ một người thương cậu</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", "Helvetica Neue", sans-serif;
      color: #613b4a;
      background: #fff0f3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 24px;
      background:
        radial-gradient(ellipse at 12% 15%, #ffe1e8 0, transparent 38%),
        radial-gradient(ellipse at 90% 85%, #f9dbe8 0, transparent 36%),
        #fff8f8;
    }

    .card {
      position: relative;
      width: min(100%, 520px);
      padding: clamp(32px, 8vw, 58px) clamp(24px, 7vw, 52px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 24px 70px rgba(160, 83, 106, 0.16);
      text-align: center;
      backdrop-filter: blur(12px);
      animation: appear 800ms ease-out both;
    }

    .eyebrow {
      margin: 0 0 20px;
      color: #d77891;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .heart {
      display: inline-block;
      margin-bottom: 12px;
      color: #e77b96;
      font-size: 3rem;
      animation: pulse 1.5s ease-in-out infinite;
    }

    h1 {
      margin: 0;
      color: #a64f6a;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.4rem, 11vw, 4rem);
      font-weight: 500;
      letter-spacing: -0.04em;
    }

    .message {
      margin: 22px 0 12px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.25rem, 5vw, 1.65rem);
      line-height: 1.55;
    }

    .message strong {
      color: #d45e7d;
      font-weight: 600;
    }

    .note {
      margin: 0 auto;
      max-width: 340px;
      color: #987b84;
      font-size: 0.98rem;
      line-height: 1.7;
    }

    .letter {
      margin: 24px auto 0;
      max-width: 340px;
      border: 1px solid #f5dce3;
      border-radius: 16px;
      background: #fff8fa;
      text-align: left;
    }

    .letter summary {
      padding: 13px 18px;
      color: #b45f78;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 700;
      text-align: center;
      list-style-position: inside;
    }

    .letter p {
      margin: 0;
      padding: 0 20px 18px;
      color: #805c68;
      font-size: 0.96rem;
      line-height: 1.7;
      text-align: center;
    }

    .sparkle {
      position: absolute;
      color: #efa2b4;
      font-size: 1.2rem;
      pointer-events: none;
      animation: float 4s ease-in-out infinite;
    }

    .sparkle-one {
      top: 12%;
      left: 10%;
    }

    .sparkle-two {
      right: 11%;
      bottom: 17%;
      animation-delay: 1.2s;
    }

    @keyframes pulse {
      50% { transform: scale(1.16); }
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes float {
      50% { transform: translateY(-9px) rotate(12deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="sparkle sparkle-one" aria-hidden="true">✦</span>
    <span class="sparkle sparkle-two" aria-hidden="true">✧</span>
    <p class="eyebrow">Có điều này muốn nói với cậu</p>
    <span class="heart" aria-hidden="true">♥</span>
    <h1>Linh à,</h1>
    <p class="message">Gọi Linh là Elizabeth,<br>vì cậu là <strong>nữ hoàng của tôi.</strong></p>
    <p class="note">Tớ thích cậu nhiều hơn một chút mỗi ngày.</p>
    <details class="letter">
      <summary>Mở lời nhắn 💌</summary>
      <p>cảm giác mấy nay cậu lạnh nhạt với tôi rất nhiều</p>
    </details>
  </main>
</body>
</html>
